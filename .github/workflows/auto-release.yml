name: Automatic release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar PR fusionada
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pr="$(jq -c '[.[] | select(.merged_at != null)][0] // empty' <<< "$prs")"
          if [[ -z "$pr" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Push no asociado a una PR fusionada; se omite."
            exit 0
          fi
          labels="$(jq -r '[.labels[].name] | join(" ")' <<< "$pr")"
          echo "number=$(jq -r '.number' <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          if [[ " $labels " == *" release:skip "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular versión, probar y etiquetar
        id: release
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          git fetch origin main --tags
          git checkout -B release origin/main

          # Reutiliza el tag si esta misma fusión se está reintentando.
          for candidate in $(git tag --list 'v[0-9]*' --sort=-v:refname); do
            if git tag -l --format='%(contents)' "$candidate" | grep -Fq "source:$GITHUB_SHA"; then
              echo "tag=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          current="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          latest_version="${latest#v}"

          if [[ -z "$latest" ]]; then
            version="$current"
          elif [[ "$current" != "$latest_version" ]] && [[ "$(printf '%s\n%s\n' "$latest_version" "$current" | sort -V | tail -n1)" == "$current" ]]; then
            version="$current"
          else
            IFS=. read -r major minor patch <<< "$latest_version"
            if [[ " $PR_LABELS " == *" release:major "* ]]; then
              major=$((major + 1)); minor=0; patch=0
            elif [[ " $PR_LABELS " == *" release:minor "* ]]; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "El tag $tag ya existe sin marcador de esta PR; se detiene para evitar sobrescribirlo."
            exit 1
          fi

          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          cargo check

          if [[ -n "$latest" ]]; then
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$latest" --jq .body)"
          else
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" --jq .body)"
          fi
          printf '%s\n' "$notes" > /tmp/release-notes.md

          if ! grep -Fq "## [$tag]" CHANGELOG.md 2>/dev/null; then
            date_utc="$(date -u +%F)"
            {
              printf '# Changelog\n\n## [%s] - %s\n\n' "$tag" "$date_utc"
              cat /tmp/release-notes.md
              printf '\n\n'
              if [[ -f CHANGELOG.md ]]; then
                sed '1{/^# Changelog$/d;}' CHANGELOG.md
              fi
            } > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md CHANGELOG.md
          fi

          cargo test --all-targets --locked

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $tag"
            git push origin HEAD:main
          fi
          release_sha="$(git rev-parse HEAD)"
          git tag -a "$tag" "$release_sha" -m "$tag" -m "source:$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
